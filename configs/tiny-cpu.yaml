# CPU-feasible run of the *same* tiny.yaml model (6L/384d/8k vocab).
# No GPU in this environment — smaller micro-batch, same effective tokens via
# grad accumulation; float32; documented wall-clock in README / artifacts.

seed: 42
device: cpu

data:
  dataset: tinystories
  raw_dir: data/raw
  processed_dir: data/processed
  source_split: train
  max_train_chars: 20000000   # 20M chars — large but tractable on CPU
  max_val_chars: 500000
  train_file: train.txt
  val_file: val.txt

tokenizer:
  vocab_size: 8000
  min_frequency: 2
  special_tokens: ["<pad>", "<unk>", "<bos>", "<eos>"]
  artifact_dir: artifacts/tokenizer

model:
  # Identical to configs/tiny.yaml
  n_layer: 6
  n_head: 6
  n_embd: 384
  block_size: 256
  dropout: 0.1
  bias: false

train:
  batch_size: 8
  gradient_accumulation_steps: 4   # effective batch ≈ 32 (matches tiny.yaml)
  learning_rate: 3.0e-4
  weight_decay: 0.1
  warmup_steps: 200
  max_steps: 3000                  # longest feasible CPU run (~30–45 min)
  eval_interval: 250
  eval_iters: 20
  log_interval: 50
  checkpoint_dir: checkpoints/tiny-cpu
  run_dir: runs/tiny-cpu
  dtype: float32

generate:
  max_new_tokens: 128
  temperature: 0.8
  top_k: 40
  prompt: "Once upon a time"
