# Serious CPU run of the *same* model as configs/tiny.yaml (6L / 384d / 8k vocab).
# No GPU available in this environment — float32, micro-batch 8 × accum 4
# (effective batch 32, matching tiny.yaml). 50M train chars, 5000 steps.
# Expect ~45–75 min wall-clock on a 4-core CPU; document actuals in README.

seed: 42
device: cpu

data:
  dataset: tinystories
  raw_dir: data/raw
  processed_dir: data/processed
  source_split: train
  max_train_chars: 50000000
  max_val_chars: 1000000
  train_file: train.txt
  val_file: val.txt

tokenizer:
  vocab_size: 8000
  min_frequency: 2
  special_tokens: ["<pad>", "<unk>", "<bos>", "<eos>"]
  artifact_dir: artifacts/tokenizer

model:
  # Identical to configs/tiny.yaml
  n_layer: 6
  n_head: 6
  n_embd: 384
  block_size: 256
  dropout: 0.1
  bias: false

train:
  batch_size: 8
  gradient_accumulation_steps: 4   # effective batch tokens ≈ 32 × 256
  learning_rate: 3.0e-4
  weight_decay: 0.1
  warmup_steps: 200
  max_steps: 5000
  eval_interval: 250
  eval_iters: 40
  log_interval: 50
  checkpoint_dir: checkpoints/tiny-cpu
  run_dir: runs/tiny-cpu
  dtype: float32

generate:
  max_new_tokens: 160
  temperature: 0.8
  top_k: 40
  prompt: "Once upon a time"
